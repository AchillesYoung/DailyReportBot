name: AI Daily Report

on:
  schedule:
    # 北京 09:00 = UTC 01:00（早报，窗口 13h）
    - cron: "0 1 * * *"
    # 北京 20:00 = UTC 12:00（晚报，窗口 11h）
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      edition:
        description: "推送类型"
        required: true
        type: choice
        options:
          - morning
          - evening
        default: morning

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine edition
        id: edition
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            echo "value=morning" >> "$GITHUB_OUTPUT"
          else
            echo "value=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Run dailybot
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python -m dailybot --edition "${{ steps.edition.outputs.value }}"
